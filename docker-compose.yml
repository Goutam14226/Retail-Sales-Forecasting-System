services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: m5_forecasting_api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: m5_forecasting_frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000/forecast"
    depends_on:
      - api
